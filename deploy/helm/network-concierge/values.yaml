replicaCount: 1
image:
  repository: ghcr.io/your-org/network-concierge
  # Empty uses the chart appVersion. Deploy immutable tags (git SHA), never latest.
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
ingress:
  enabled: false
  className: ""
  host: network.example.com
  tls: []
existingSecret: network-concierge-secrets
imagePullSecrets: []
worker:
  enabled: true
  replicaCount: 1
  existingSecret: network-worker-secrets
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
networkPolicy:
  # Default-deny for both pods: the API accepts HTTP only on its port, the worker accepts nothing.
  # Egress is DNS plus HTTPS (Elastic Serverless, Kibana Agent Builder, Dash0 OTLP).
  enabled: true
  egressPorts: [443]
