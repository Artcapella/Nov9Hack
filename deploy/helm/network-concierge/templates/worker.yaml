{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "network-concierge.fullname" . }}-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ include "network-concierge.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ include "network-concierge.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker }
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 90
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, app.worker]
          envFrom: [{ secretRef: { name: {{ .Values.worker.existingSecret }} } }]
          env:
            - { name: OTEL_SERVICE_NAME, value: network-worker }
            # Worker role: runs without the contact encryption key (it never reads contacts).
            - { name: NETWORK_ROLE, value: worker }
            - { name: K8S_POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: K8S_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: K8S_NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE),k8s.node.name=$(K8S_NODE_NAME),k8s.deployment.name={{ include "network-concierge.fullname" . }}-worker" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/network-worker-heartbeat').st_mtime < 180"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: [python, -c, "import os,time; assert time.time()-os.stat('/tmp/network-worker-heartbeat').st_mtime < 180"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 64Mi } }]
{{- end }}
