apiVersion: v1
kind: Service
metadata:
  name: {{ include "network-concierge.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector: { app.kubernetes.io/name: {{ include "network-concierge.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
