name: verify
on: [pull_request, push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 } # full history for secret scanning and Sonar blame
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest-cov==6.0.0 pip-audit==2.9.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with: { version: v3.17.4 }
      - name: Secret scan (full history, redacted output)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner
      - name: Dependency audit (known CVEs)
        run: pip-audit -r requirements.txt --progress-spinner off
      - run: python -m compileall app mcp scripts
      - run: pytest -q --cov=app --cov-report=xml
      - run: helm lint deploy/helm/network-concierge
      - run: docker build -t network-concierge:test .
      # Sonar quality gate: runs when the SONAR_TOKEN repository secret is configured.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
